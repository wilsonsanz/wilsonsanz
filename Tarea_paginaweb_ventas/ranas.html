<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información sobre Ranas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .pdf-container {
            margin-top: 30px;
            width: 80%; /* Ajusta el ancho del contenedor */
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #ccc; /* Borde opcional para el iframe */
        }
        iframe {
            width: 100%;
            height: 600px; /* Ajusta la altura del visor del PDF */
            border: none;
        }
        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Documento sobre Ranas</h1>

    <div class="pdf-container">
        <iframe src="ranas.pdf"></iframe>
    </div>

    <button class="back-button" onclick="history.back()">Volver a la página anterior</button>
</body>
</html>
